name: RidePulse CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-backend:
    name: Build & Test Java Microservices (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Multi-Module Maven Project
        run: mvn clean test

  verify-ml-pricing:
    name: Verify ML Dynamic Pricing Service (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ml-demand-pricing/requirements.txt

      - name: Validate Python Compilation
        run: |
          cd services/ml-demand-pricing
          python -m py_compile app/main.py app/pricing_engine.py
