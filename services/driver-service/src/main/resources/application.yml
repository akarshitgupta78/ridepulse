server:
  port: 8087

spring:
  application:
    name: driver-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ridepulse_db
    username: ridepulse_user
    password: ridepulse_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
